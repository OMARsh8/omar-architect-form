<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>OMAR ARCHITECT | طلب تصميم</title>
<style>
:root{--ink:#111;--paper:#f6f1e8;--card:#fffdfa;--muted:#7b736b;--line:#ded5ca;--accent:#d8b894;--dark:#101111;--ok:#1f7a56;--err:#9a3d3d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;color:var(--ink)}
button,input,textarea,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{max-width:760px;margin:auto;min-height:100vh;background:var(--dark)}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;position:sticky;top:0;z-index:20;background:rgba(16,17,17,.96);backdrop-filter:blur(12px)}
.top img{width:112px;max-height:36px;object-fit:contain}
.prog{display:flex;align-items:center;gap:8px;direction:ltr}
.track{width:90px;height:2px;background:#383a3a;border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:.3s}
.pct{font-size:10px;color:#aaa}
.screen{min-height:calc(100vh - 64px);background:var(--paper);padding:34px 20px 120px;position:relative}
.screen.dark{background:linear-gradient(180deg,#111 0%,#171818 100%);color:#fff;padding:0}
.hero{min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 24px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,rgba(216,184,148,.13),transparent 30%),linear-gradient(135deg,transparent 0 47%,rgba(255,255,255,.03) 47% 48%,transparent 48% 100%);pointer-events:none}
.hero img{width:220px;max-width:70%;position:relative;z-index:1;margin-bottom:42px}
.hero h1{font-size:40px;line-height:1.45;margin:0 0 14px;position:relative;z-index:1}
.hero p{font-size:15px;line-height:1.9;color:#d2ccc5;max-width:400px;position:relative;z-index:1;margin:0}
.hero .start{margin-top:28px;width:100%;max-width:320px;background:var(--accent);color:var(--ink);min-height:56px;position:relative;z-index:2}
.sectionhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:30px}
.sectionhead img{width:116px;max-height:48px;object-fit:contain}
.step{font-size:11px;color:#9a928a}
.eyebrow{font-size:10px;letter-spacing:.12em;color:#9a928a;font-weight:700}
h2{font-size:30px;line-height:1.45;margin:0 0 10px}
.lead{font-size:14px;color:var(--muted);line-height:1.9;margin:0 0 22px}
.options{display:grid;gap:11px;margin-top:18px}
.option{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;min-height:62px;cursor:pointer;transition:.18s}
.option.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.option input{width:18px;height:18px;accent-color:#111;flex:0 0 auto}
.option .text{flex:1}
.option strong{display:block;font-size:15px}
.option small{display:block;font-size:11px;color:#8e857d;margin-top:3px;line-height:1.6}
.option.sel small{color:#bbb}
.field{margin-top:18px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 15px;outline:none;font-size:16px}
textarea{min-height:135px;resize:vertical;line-height:1.8}
input:focus,textarea:focus,select:focus{border-color:#a69b90;box-shadow:0 0 0 3px rgba(216,184,148,.14)}
.groupTitle{font-size:15px;font-weight:800;margin:26px 0 8px}
.hint{font-size:12px;color:var(--muted);line-height:1.8}
.counter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.counter-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;text-align:center}
.counter-card label{font-size:12px;line-height:1.6;display:block;min-height:40px}
.counter{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.counter button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px}
.counter span{font-size:20px;font-weight:800}
.upload{border:1px dashed #c9bfb4;border-radius:16px;background:#fff;padding:22px;text-align:center;color:var(--muted);margin-top:18px}
.upload input{margin-top:12px;max-width:100%;width:100%}
.file-list{font-size:12px;text-align:right;margin-top:10px;line-height:1.8}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:flex;gap:10px;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 72%,rgba(246,241,232,.94) 86%,rgba(246,241,232,0));z-index:19}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:800;cursor:pointer}
.nav .btn{flex:1}
.primary{background:var(--ink);color:#fff}
.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.review{border-top:1px solid var(--line);margin-top:20px}
.row{padding:14px 0;border-bottom:1px solid var(--line)}
.row b{display:block;font-size:13px;margin-bottom:5px}
.row span{font-size:14px;color:var(--muted);line-height:1.7;white-space:pre-wrap}
.note-card{border:1px solid var(--line);border-radius:18px;background:#fff;padding:20px;line-height:2;color:#514b45}
.notice{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.7;display:none}
.notice.show{display:block}
.notice.error{background:#f7e9e9;color:var(--err)}
.notice.ok{background:#e8f4ef;color:var(--ok)}
.thanks{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;text-align:center;padding:36px 24px;position:relative}
.check{width:68px;height:68px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-size:30px;margin:0 auto 28px}
.thanks img{width:210px;margin:34px auto 28px}
.thanks p{color:#d2ccc5;line-height:1.9}
.max-note{font-size:11px;color:#91877f;margin-top:10px}
@media(max-width:480px){
  h2{font-size:27px}
  .counter-grid{grid-template-columns:1fr}
  .screen{padding-top:28px}
}
@media(min-width:700px){
  .screen{border-radius:28px 28px 0 0;min-height:760px;margin-top:10px}
  .app{padding:10px}
  .top{border-radius:18px}
}
</style>
</head>

function nav(next='التالي',submit=false){
  return `<div class="nav"><button type="button" class="btn secondary" data-prev>رجوع</button><button type="button" class="btn primary" ${submit?'data-submit':'data-next'} ${submitting?'disabled':''}>${submitting?'جارٍ الإرسال…':next+' ←'}</button></div>`;
}
function frame(n,k,t,body,d=''){return `<section class="screen">${head(n,k,t,d)}${body}${nav()}</section>`}
function isResidential(){return ['villa','resthouse','chalet','duplex','building','apartment'].includes(state.projectType)}
function needsBedroomCounts(){return isResidential()&&(has(state.bedroomSpaces,'sons')||has(state.bedroomSpaces,'daughters')||has(state.bedroomSpaces,'other'))}
function hasInterior(){return has(state.services,'interior')}
function otherBox(trigger,value,id,label='اكتب التفاصيل'){return trigger?textField(id,label,'اكتب هنا…'):''}

{id:'review',always:true,render:()=>{
  const project=L.projectType[state.projectType]||state.otherProject||'—';
  const summary=[
    ['الخدمة المطلوبة',arrText(state.services,L.services)],
    ['نوع المشروع',project],
    ['معلومات الأرض والموقع',state.landInfo||'—'],
    ['رابط الموقع',state.locationLink||'—'],
    ...(isResidential()?[
      ['الاستخدام الرئيسي',L.usage[state.usage]||state.usageOther||'—'],
      ['أفراد الأسرة',`البالغون: ${state.adults} · الأطفال: ${state.children} · كبار السن أو ذوو الهمم: ${state.specialUsers}`],
      ['زيادة متوقعة في أفراد الأسرة',L.growth[state.growth]||'—'],
      ['نوع المطبخ',L.kitchenType[state.kitchenType]||'—'],
      ['الخصوصية',L.privacy[state.privacy]||'—'],
      ['عدد الأدوار',L.floors[state.floors]||'—'],
      ['المصعد',L.yesno[state.elevator]||'—']
    ]:[]),
    ['الأولويات',arrText(state.priorities,{privacy:'الخصوصية',space_quality:'جودة واستغلال المساحات',natural_light:'الإضاءة الطبيعية',comfort:'الراحة وسهولة الاستخدام',spacious:'المساحات الواسعة',aesthetic:'الطابع الجمالي',maintenance:'سهولة الصيانة',future:'المرونة المستقبلية',cost:'ضبط تكلفة التنفيذ',other:state.priorityOther||'أخرى'})],
    ['الميزانية',`${L.budgetStatus[state.budgetStatus]||'—'}${state.budgetAmount?' — '+state.budgetAmount:''}`],
    ['بدء المشروع',L.startTime[state.startTime]||'—'],
    ['الاسم',state.fullName||'—'],
    ['رقم الجوال',state.phone||'—'],
    ['المدينة',state.city||'—']
  ];
  return `<section class="screen">${head('21','مراجعة الطلب','مراجعة الطلب','راجع معلوماتك قبل الإرسال، ويمكنك العودة لتعديل أي جزء إذا رغبت.')}<div class="review">${summary.map(r=>`<div class="row"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div><div id="sendNotice" class="notice"></div>${nav('إرسال الطلب',true)}</section>`;
}},

];

function active(){return steps.filter(s=>s.always||!s.cond||s.cond())}
function current(){const a=active();if(idx>=a.length)idx=a.length-1;return a[idx]}
function saveFields(){document.querySelectorAll('[data-bind]').forEach(el=>state[el.dataset.bind]=el.value)}
function validateStep(id){
  if(id==='services' && state.services.length===0) return 'اختر خدمة واحدة على الأقل.';
  if(id==='project' && !state.projectType) return 'اختر نوع المشروع.';
  if(id==='contact' && (!state.fullName.trim()||!state.phone.trim()||!state.city.trim())) return 'يرجى إدخال الاسم ورقم الجوال والمدينة.';
  return '';
}
function showInlineError(msg){
  let n=document.getElementById('inlineError');
  if(!n){n=document.createElement('div');n.id='inlineError';n.className='notice error show';const screen=root.querySelector('.screen');screen.insertBefore(n,screen.querySelector('.nav'));}
  n.textContent=msg;
}
function bind(){
  document.querySelectorAll('.option input').forEach(inp=>inp.onchange=()=>{
    const n=inp.name;
    if(inp.type==='checkbox'){
      let vals=[...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x=>x.value);
      const max=Number(inp.dataset.max||0);
      if(max && vals.length>max){inp.checked=false;showInlineError(`يمكن اختيار حتى ${max} خيارات فقط.`);return}
      state[n]=vals;
    } else state[n]=inp.value;
    render();
  });
  document.querySelectorAll('[data-bind]').forEach(el=>el.oninput=()=>state[el.dataset.bind]=el.value);
  document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{state[b.dataset.inc]=(state[b.dataset.inc]||0)+1;render()});
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{state[b.dataset.dec]=Math.max(0,(state[b.dataset.dec]||0)-1);render()});
  document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>move(1));
  document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>move(-1));
  const st=document.getElementById('start'); if(st)st.onclick=()=>move(1);
  const rr=document.getElementById('restart'); if(rr)rr.onclick=()=>{location.reload()};
  const fi=document.getElementById('fileInput');
  if(fi){
    fi.onchange=()=>{state.files=[...fi.files];renderFileList()};
    renderFileList();
  }
  const submit=document.querySelector('[data-submit]'); if(submit)submit.onclick=submitForm;
}
function renderFileList(){
  const el=document.getElementById('fileList'); if(!el)return;
  el.innerHTML=state.files.length?state.files.map(f=>`• ${esc(f.name)} (${Math.ceil(f.size/1024)} KB)`).join('<br>'):'';
}
function move(d){
  saveFields();
  if(d>0){
    const err=validateStep(current().id);
    if(err){showInlineError(err);return}
  }
  const a=active();
  idx=Math.max(0,Math.min(idx+d,a.length-1));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  const a=active();
  if(idx>=a.length)idx=a.length-1;
  const s=a[idx];
  root.innerHTML=s.render();
  const p=Math.round(idx/Math.max(1,a.length-1)*100);
  document.getElementById('fill').style.width=p+'%';
  document.getElementById('pct').textContent=p+'%';
  bind();
}
async function uploadFiles(submissionId){
  const uploaded=[];
  for(const file of state.files){
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const path=`${submissionId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safe}`;
    const res=await fetch(`${SUPABASE_URL}/storage/v1/object/project-documents/${encodeURI(path)}`,{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},
      body:file
    });
    if(!res.ok) throw new Error('تعذر رفع أحد المرفقات.');
    uploaded.push({name:file.name,path,size:file.size,type:file.type});
  }
  return uploaded;
}
function allAnswers(uploaded,submissionId){
  const copy={...state};
  delete copy.files;
  copy.attachments=uploaded;
  copy.submission_id=submissionId;
  return copy;
}
async function submitForm(){
  saveFields();
  const err=validateStep('contact');
  if(err){showInlineError(err);return}
  if(submitting)return;
  submitting=true;render();
  try{
    const submissionId=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
    const uploaded=await uploadFiles(submissionId);
    const payload={
      client_name:state.fullName.trim(),
      phone:state.phone.trim(),
      email:state.email.trim()||null,
      project_type:state.projectType||null,
      services:state.services,
      location_link:state.locationLink.trim()||null,
      status:'new',
      answers:allAnswers(uploaded,submissionId)
    };
    const res=await fetch(`${SUPABASE_URL}/rest/v1/client_requests`,{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(payload)
    });
    if(!res.ok){
      const t=await res.text();
      console.error(t);
      throw new Error('تعذر حفظ الطلب.');
    }
    submitting=false;
    const a=active(); idx=a.findIndex(s=>s.id==='thanks'); render(); window.scrollTo(0,0);
  }catch(e){
    console.error(e);
    submitting=false;
    render();
    const n=document.getElementById('sendNotice');
    if(n){n.className='notice error show';n.textContent='حدثت مشكلة أثناء الإرسال. يرجى المحاولة مرة أخرى.'}
  }
}
render();
</script>
