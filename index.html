<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>OMAR ARCHITECT | طلب تصميم</title>
<style>
:root{--ink:#111;--paper:#f6f1e8;--card:#fffdfa;--muted:#7b736b;--line:#ded5ca;--accent:#d8b894;--dark:#101111;}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;color:var(--ink)}
button,input,textarea,select{font:inherit}
.app{max-width:760px;margin:auto;min-height:100vh;background:var(--dark)}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;position:sticky;top:0;z-index:10;background:rgba(16,17,17,.96);backdrop-filter:blur(12px)}
.top img{width:112px;max-height:36px;object-fit:contain} .prog{display:flex;align-items:center;gap:8px;direction:ltr} .track{width:90px;height:2px;background:#383a3a;border-radius:99px;overflow:hidden} .fill{height:100%;background:var(--accent);width:0} .pct{font-size:10px;color:#aaa}
.screen{min-height:calc(100vh - 64px);background:var(--paper);padding:28px 20px 120px;position:relative}
.screen.dark{background:linear-gradient(180deg,#111 0%,#171818 100%);color:#fff;padding:0}
.hero{min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 24px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,rgba(216,184,148,.13),transparent 30%),linear-gradient(135deg,transparent 0 47%,rgba(255,255,255,.03) 47% 48%,transparent 48% 100%)}
.hero img{width:220px;max-width:70%;position:relative;z-index:1;margin-bottom:42px} h1{font-size:40px;line-height:1.45;margin:0 0 14px;position:relative;z-index:1} .hero p{font-size:15px;line-height:1.9;color:#d2ccc5;max-width:360px;position:relative;z-index:1}
.hero .start{margin-top:28px;width:100%;max-width:320px;background:var(--accent);color:var(--ink);flex:0 0 auto;min-height:56px;touch-action:manipulation}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px} .sectionhead img{width:116px;max-height:48px;object-fit:contain} .step{font-size:11px;color:#9a928a} .eyebrow{font-size:10px;letter-spacing:.16em;color:#9a928a;font-weight:700}
h2{font-size:30px;line-height:1.5;margin:0 0 10px} .lead{font-size:14px;color:var(--muted);line-height:1.8;margin:0 0 22px}
.options{display:grid;gap:11px;margin-top:18px} .option{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;min-height:64px;cursor:pointer;transition:.18s} .option.sel{background:var(--ink);color:#fff;border-color:var(--ink)} .option input{width:18px;height:18px;accent-color:#111;flex:0 0 auto} .option .text{flex:1} .option strong{display:block;font-size:15px} .option small{display:block;font-size:11px;color:#8e857d;margin-top:3px} .option.sel small{color:#bbb} .ico{width:38px;height:38px;border:1px solid currentColor;border-radius:11px;display:grid;place-items:center;opacity:.85}
.field{margin-top:18px} .field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px} input[type=text],input[type=number],input[type=tel],textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 15px;outline:none;font-size:16px} textarea{min-height:120px;resize:vertical;line-height:1.7} input:focus,textarea:focus,select:focus{border-color:#a69b90;box-shadow:0 0 0 3px rgba(216,184,148,.14)}
.counter{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:18px;background:#fff;padding:10px 12px;margin-top:12px} .counter button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px} .counter span{font-size:24px;font-weight:700}
.groupTitle{font-size:15px;font-weight:800;margin:24px 0 8px} .hint{font-size:12px;color:var(--muted);line-height:1.7}
.upload{border:1px dashed #c9bfb4;border-radius:16px;background:#fff;padding:24px;text-align:center;color:var(--muted)} .upload input{margin-top:12px;max-width:100%}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:flex;gap:10px;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 72%,rgba(246,241,232,.94) 86%,rgba(246,241,232,0));z-index:9} .btn{border:0;border-radius:14px;padding:15px 18px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent} .nav .btn{flex:1} .primary{background:var(--ink);color:#fff} .secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}
.review{border-top:1px solid var(--line);margin-top:20px} .row{padding:14px 0;border-bottom:1px solid var(--line)} .row b{display:block;font-size:13px;margin-bottom:4px} .row span{font-size:14px;color:var(--muted);line-height:1.7}
.thanks{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;text-align:center;padding:36px 24px;position:relative} .check{width:68px;height:68px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-size:30px;margin:0 auto 28px} .thanks img{width:210px;margin:34px auto 28px} .thanks p{color:#d2ccc5;line-height:1.9}
.badge{display:inline-block;font-size:11px;padding:5px 8px;border-radius:999px;background:#eee6dc;color:#6e655d;margin-top:4px}
@media(min-width:700px){.screen{border-radius:28px 28px 0 0;min-height:760px;margin-top:10px} .app{padding:10px} .top{border-radius:18px}}
</style>
</head>

  const start=e.target.closest&&e.target.closest('#start');

  const next=e.target.closest&&e.target.closest('[data-next]');

  const prev=e.target.closest&&e.target.closest('[data-prev]');
  if(prev){e.preventDefault();move(-1);return}
});
