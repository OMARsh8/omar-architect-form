<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>OMAR ARCHITECT | طلب تصميم</title>

<!-- PDF generation is done in the customer's browser so Arabic/RTL is rendered by the browser itself. -->

<style>
:root{
  --ink:#111111;--paper:#f6f1e8;--card:#fffdfa;--muted:#766f68;
  --line:#ddd4c8;--accent:#d8b894;--dark:#101111;--ok:#1f7a56;--err:#9a3d3d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;color:var(--ink)}
button,input,textarea,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{max-width:760px;margin:auto;min-height:100vh;background:var(--dark)}
.top{
  height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  position:sticky;top:0;z-index:20;background:rgba(246,241,232,.97);
  border-bottom:1px solid rgba(17,17,17,.08);backdrop-filter:blur(12px)
}
.top.hidden{display:none}
.top img{width:118px;max-height:40px;object-fit:contain}
.prog{display:flex;align-items:center;gap:8px;direction:ltr}
.track{width:92px;height:2px;background:#d7cfc5;border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--ink);width:0;transition:.3s}
.pct{font-size:10px;color:#777}
.screen{min-height:calc(100vh - 66px);background:var(--paper);padding:34px 20px 120px;position:relative}
.screen.dark{min-height:100vh;background:linear-gradient(180deg,#101111 0%,#171818 100%);color:#fff;padding:0}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:42px 24px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 68% 24%,rgba(216,184,148,.13),transparent 30%),linear-gradient(135deg,transparent 0 47%,rgba(255,255,255,.03) 47% 48%,transparent 48% 100%);pointer-events:none}
.hero img{width:290px;max-width:78%;position:relative;z-index:1;margin-bottom:54px;filter:invert(1)}
.hero-title{position:relative;z-index:1;width:min(390px,92%);margin:auto;font-size:31px;font-weight:700;line-height:1.35;text-align:right}
.hero-title .l1{display:block}
.hero-title .l2{display:block;margin-right:46%;white-space:nowrap;margin-top:5px}
.hero p{font-size:14px;line-height:1.95;color:#d1cbc3;max-width:420px;position:relative;z-index:1;margin:20px 0 0}
.hero .start{margin-top:32px;width:100%;max-width:320px;background:var(--accent);color:var(--ink);min-height:56px;position:relative;z-index:2}
.sectionhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:30px}
.sectionhead img{width:124px;max-height:49px;object-fit:contain}
.step{font-size:11px;color:#948c84}
.eyebrow{font-size:10px;letter-spacing:.12em;color:#948c84;font-weight:700}
h2{font-size:29px;line-height:1.45;margin:0 0 10px}
.lead{font-size:14px;color:var(--muted);line-height:1.95;margin:0 0 22px}
.options{display:grid;gap:11px;margin-top:18px}
.option{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;min-height:62px;cursor:pointer;transition:.18s}
.option.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.option input{width:18px;height:18px;accent-color:#111;flex:0 0 auto}
.option .text{flex:1}
.option strong{display:block;font-size:15px}
.option small{display:block;font-size:11px;color:#8e857d;margin-top:3px;line-height:1.6}
.option.sel small{color:#bbb}
.field{margin-top:18px}
.field label{display:block;font-size:14px;font-weight:800;margin-bottom:8px}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 15px;outline:none;font-size:16px}
textarea{min-height:135px;resize:vertical;line-height:1.8}
input:focus,textarea:focus,select:focus{border-color:#a69b90;box-shadow:0 0 0 3px rgba(216,184,148,.14)}
.groupTitle{font-size:15px;font-weight:800;margin:26px 0 8px}
.hint{font-size:12px;color:var(--muted);line-height:1.8}
.counter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.counter-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;text-align:center}
.counter-card label{font-size:12px;line-height:1.6;display:block;min-height:40px}
.counter{display:flex;align-items:center;justify-content:space-between;margin-top:8px;direction:ltr}
.counter button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px}
.counter span{font-size:20px;font-weight:800}
.upload{border:1px dashed #c9bfb4;border-radius:16px;background:#fff;padding:22px;text-align:center;color:var(--muted);margin-top:18px}
.upload input{margin-top:12px;max-width:100%;width:100%}
.file-list{font-size:12px;text-align:right;margin-top:12px;line-height:1.9}
.file-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #eee7de}
.file-item:last-child{border-bottom:0}
.file-remove{border:0;background:transparent;color:#9a3d3d;font-weight:800;cursor:pointer}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:flex;gap:10px;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 72%,rgba(246,241,232,.94) 86%,rgba(246,241,232,0));z-index:19}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:800;cursor:pointer}
.nav .btn{flex:1}
.primary{background:var(--ink);color:#fff}
.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.review{display:grid;gap:12px;margin-top:20px}
.review-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px}
.review-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:7px}
.review-top b{font-size:13px}
.edit-link{border:0;background:transparent;color:#806a52;font-size:12px;font-weight:800;cursor:pointer;padding:2px 0}
.review-card span{font-size:13px;color:var(--muted);line-height:1.8;white-space:pre-wrap}
.note-card{border:1px solid var(--line);border-radius:18px;background:#fff;padding:21px;line-height:2.05;color:#4f4943}
.note-card strong{display:block;color:#111;margin-bottom:8px}
.notice{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.7;display:none}
.notice.show{display:block}
.notice.error{background:#f7e9e9;color:var(--err)}
.notice.ok{background:#e8f4ef;color:var(--ok)}
.thanks{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:42px 24px}
.thanks-inner{width:min(460px,100%)}
.check{width:68px;height:68px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-size:30px;margin:0 auto 28px}
.thanks h2{color:#fff;font-size:32px}
.thanks p{color:#d2ccc5;line-height:1.95}
.thanks img{display:block;width:235px;max-width:72%;margin:38px auto 30px;filter:invert(1)}
.thanks .home-btn{width:min(260px,100%);background:var(--accent);color:#111}
.max-note{font-size:11px;color:#91877f;margin-top:10px}

/* Hidden PDF canvas */
#pdfStage{position:fixed;left:-20000px;top:0;width:794px;background:#fff;z-index:-1}
.pdf-sheet{width:794px;background:#fff;color:#171717;padding:54px 54px 60px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;direction:rtl}
.pdf-header{display:flex;direction:ltr;justify-content:space-between;align-items:flex-start;margin-bottom:36px}
.pdf-logo{width:155px;height:auto}
.pdf-id{text-align:left;direction:ltr;padding-top:5px}
.pdf-id small{display:block;font:700 10px Arial,sans-serif;letter-spacing:2px;color:#988a78;margin-bottom:4px}
.pdf-id strong{font:700 21px Arial,sans-serif}
.pdf-hero{border-top:1px solid #222;padding-top:34px;margin-bottom:31px}
.pdf-hero h1{margin:0 0 8px;font-size:31px;line-height:1.35}
.pdf-hero p{margin:0;font-size:12px;color:#897d70}
.pdf-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:34px}
.pdf-summary .box{background:#f7f3ec;border:1px solid #e5ddcf;border-radius:11px;padding:13px;min-height:68px}
.pdf-summary .lab{font-size:10px;font-weight:800;color:#968672;margin-bottom:5px}
.pdf-summary .val{font-size:13px;font-weight:800;line-height:1.55}
.pdf-section{margin-bottom:26px;page-break-inside:avoid}
.pdf-section h3{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.pdf-section h3:before{content:"";display:inline-block;width:21px;height:2px;background:#b4936b}
.pdf-card{border:1px solid #e8e1d7;border-radius:11px;overflow:hidden}
.pdf-row{display:grid;grid-template-columns:72% 28%;direction:ltr;min-height:42px;border-bottom:1px solid #eee8df;align-items:stretch}
.pdf-row:last-child{border-bottom:0}
.pdf-label{grid-column:2;direction:rtl;text-align:right;background:#fbfaf7;color:#837765;font-size:11px;font-weight:800;padding:10px 12px;display:flex;align-items:center}
.pdf-value{grid-column:1;direction:rtl;text-align:right;color:#26221e;font-size:11.5px;padding:10px 13px;display:flex;align-items:center;line-height:1.75;overflow-wrap:anywhere}
.pdf-value.ltr{direction:ltr;text-align:left;font-family:Arial,sans-serif}
.pdf-note{background:#f7f3ec;border:1px solid #e5ddcf;border-right:3px solid #b4936b;border-radius:10px;padding:12px 14px;font-size:11.5px;line-height:1.9}
.pdf-footer{margin-top:28px;color:#9a8e80;font:700 9px Arial,sans-serif;direction:ltr;text-align:left;letter-spacing:.7px}
@media(max-width:480px){h2{font-size:26px}.counter-grid{grid-template-columns:1fr}.screen{padding-top:28px}.hero-title{font-size:27px}}
</style>
</head>

<div id="root">
  <div class="app"><main class="screen dark"><div class="hero">
    <div style="font-size:18px;letter-spacing:.22em;margin-bottom:50px;position:relative;z-index:1">OMAR ARCHITECT</div>
    <div class="hero-title"><span class="l1">نصغي أولًا …</span><span class="l2">ثم نصمم …</span></div>

  </div></main></div>
</div>
<div id="pdfStage" aria-hidden="true"></div>
<script>
window.addEventListener("error",function(e){
  var r=document.getElementById("root");

});
</script>

const a=(m,k)=>(m && m[k])||k||"—";
const list=(m,arr)=>(arr && arr.length)?arr.map(x=>a(m,x)).join("، "):"—";
const has=(arr,v)=>Array.isArray(arr)&&arr.includes(v);
const isResidential=()=>state.projectType && state.projectType!=="commercial" && state.projectType!=="other";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function top(progress=0){
 return `<header class="top"><img src="${LOGO}" alt="OMAR ARCHITECT"><div class="prog"><div class="track"><div class="fill" style="width:${progress}%"></div></div><div class="pct">${progress}%</div></div></header>`;
}
function frame(eyebrow,title,body){
 const visible=visiblePages(); const pos=visible.findIndex(p=>p.id===(pages[current]&&pages[current].id))+1; const pct=Math.round((pos-1)/Math.max(1,visible.length-1)*100);
 return `<div class="app">${top(pct)}<main class="screen"><div class="sectionhead"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div><img src="${LOGO}" alt=""></div>${body}<div id="notice" class="notice"></div></main>${nav()}</div>`;
}
function nav(){
 const p=pages[current]; if(p.id==="review") return `<div class="nav"><button class="btn secondary" onclick="goPrev()">السابق</button><button id="submitBtn" class="btn primary" onclick="submitRequest()">إرسال الطلب</button></div>`;
 return `<div class="nav"><button class="btn secondary" onclick="${reviewReturn?'backToReview()':'goPrev()'}">${reviewReturn?'العودة للمراجعة':'السابق'}</button><button class="btn primary" onclick="goNext()">التالي</button></div>`;
}
function optionGroup(key,items,multi=false,max=null){
 return `<div class="options">${items.map(o=>{
  const checked=multi?has(state[key],o.v):state[key]===o.v;
  return `<label class="option ${checked?'sel':''}"><input type="${multi?'checkbox':'radio'}" ${checked?'checked':''} onchange="pick('${key}','${o.v}',${multi},${max||'null'})"><div class="text"><strong>${o.l}</strong></div></label>`;
 }).join("")}</div>`;
}
function otherBox(show,key,label="اكتب التفاصيل هنا…"){return show?`<div class="field"><input type="text" value="${esc(state[key])}" placeholder="${label}" oninput="setVal('${key}',this.value)"></div>`:""}
function textField(key,label,placeholder,type="text",optional=false){return `<div class="field"><label>${label}${optional?' <span class="hint">— اختياري</span>':''}</label><input type="${type}" value="${esc(state[key])}" placeholder="${placeholder}" oninput="setVal('${key}',this.value)"></div>`}
function textArea(key,label,placeholder){return `<div class="field"><label>${label}</label><textarea placeholder="${placeholder}" oninput="setVal('${key}',this.value)">${esc(state[key])}</textarea></div>`}
function counter(key,label){return `<div class="counter-card"><label>${label}</label><div class="counter"><button type="button" onclick="inc('${key}',-1)">−</button><span>${state[key]}</span><button type="button" onclick="inc('${key}',1)">+</button></div></div>`}
function setVal(k,v){state[k]=v}
function inc(k,d){state[k]=Math.max(0,(Number(state[k])||0)+d);render()}
function pick(k,v,multi,max){
 if(multi){let arr=[...(state[k]||[])]; if(arr.includes(v))arr=arr.filter(x=>x!==v); else {if(max&&arr.length>=max){showNotice(`يمكن اختيار ${max} خيارات كحد أقصى.`,"error");return} arr.push(v)} state[k]=arr}
 else state[k]=v;
 render();
}

{id:"thanks",always:true,render:()=>`<div class="app"><main class="screen dark"><div class="thanks"><div class="thanks-inner"><div class="check">✓</div><h2>شكرًا لك</h2><p>تم استلام طلبك بنجاح.<br>سيتواصل معك فريق التصميم عند الحاجة إلى أي معلومات إضافية.</p><img src="${LOGO}" alt="OMAR ARCHITECT"><button class="btn home-btn" onclick="location.reload()">العودة للرئيسية</button></div></div></main></div>`}
];

function visiblePages(){return pages.filter(p=>p.always||!p.cond||p.cond())}
function render(){
 const p=pages[current]; if(!p){current=0;return render()}
 document.getElementById("root").innerHTML=p.render();
}
function goNext(){
 const vis=visiblePages(), idx=vis.findIndex(p=>p.id===pages[current].id); if(idx<0)return;
 if(!validatePage(pages[current].id))return;
 const next=vis[Math.min(idx+1,vis.length-1)]; current=pages.indexOf(next); render(); window.scrollTo(0,0);
}
function goPrev(){
 const vis=visiblePages(), idx=vis.findIndex(p=>p.id===pages[current].id);
 const prev=vis[Math.max(0,idx-1)]; current=pages.indexOf(prev); render(); window.scrollTo(0,0);
}
function backToReview(){reviewReturn=false;current=pages.findIndex(p=>p.id==="review");render();window.scrollTo(0,0)}
function editSection(id){reviewReturn=true;current=pages.findIndex(p=>p.id===id);render();window.scrollTo(0,0)}
function showNotice(msg,type="error"){const n=document.getElementById("notice");if(n){n.textContent=msg;n.className=`notice show ${type}`;window.scrollTo({top:0,behavior:"smooth"})}}
function validatePage(id){
 if(id==="service"&&!state.services.length){showNotice("اختر خدمة واحدة على الأقل.");return false}
 if(id==="project"&&!state.projectType){showNotice("اختر نوع المشروع.");return false}
 if(id==="contact"){
  if(!state.fullName.trim()||!state.phone.trim()||!state.city.trim()){showNotice("يرجى إدخال الاسم ورقم الجوال والمدينة.");return false}
 }
 return true;
}
function addFiles(files){
 const incoming=[...files]; for(const f of incoming){if(!selectedFiles.some(x=>x.name===f.name&&x.size===f.size))selectedFiles.push(f)}
 render();
}
function removeFile(i){selectedFiles.splice(i,1);render()}
function renderFileList(){
 if(!selectedFiles.length)return `<div class="hint" style="margin-top:10px">لم يتم اختيار ملفات بعد.</div>`;
 return `<div><strong>${selectedFiles.length} ملفات جاهزة للرفع</strong>${selectedFiles.map((f,i)=>`<div class="file-item"><span>${esc(f.name)} <span class="hint">(${formatBytes(f.size)})</span></span><button type="button" class="file-remove" onclick="removeFile(${i})">حذف</button></div>`).join("")}</div>`;
}
function formatBytes(n){if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";return(n/1048576).toFixed(1)+" MB"}

function renderReview(){
 const body=`<p class="lead">راجع معلوماتك قبل الإرسال، ويمكنك تعديل أي قسم مباشرة.</p><div class="review">${reviewData().map(r=>`<div class="review-card"><div class="review-top"><b>${r.title}</b><button class="edit-link" onclick="editSection('${r.id}')">تعديل</button></div><span>${esc(r.value)}</span></div>`).join("")}</div><div id="notice" class="notice"></div>`;
 return frame("21","مراجعة الطلب",body);
}

function allAnswers(uploaded,submissionId){
 return {...state,attachments:uploaded,submission_id:submissionId};
}
async function uploadFiles(submissionId){
 const uploaded=[];
 for(const f of selectedFiles){
  const safe=f.name.replace(/[^\w.\-\u0600-\u06FF]+/g,"_");
  const path=`${submissionId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safe}`;
  const res=await fetch(`${SUPABASE_URL}/storage/v1/object/project-documents/${encodePath(path)}`,{
   method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,"Content-Type":f.type||"application/octet-stream","x-upsert":"false"},body:f
  });
  if(!res.ok)throw new Error(`تعذر رفع الملف ${f.name}`);
  uploaded.push({name:f.name,path,size:f.size,type:f.type||"application/octet-stream"});
 }
 return uploaded;
}
function encodePath(p){return p.split("/").map(encodeURIComponent).join("/")}

function pdfRow(label,value,ltr=false){
 return `<div class="pdf-row"><div class="pdf-value ${ltr?"ltr":""}">${esc(value||"—")}</div><div class="pdf-label">${esc(label)}</div></div>`;
}
function pdfSection(title,rows){
 return `<section class="pdf-section"><h3>${title}</h3><div class="pdf-card">${rows.join("")}</div></section>`;
}
function buildBrief(projectNumber,team=false,uploaded=[]){
 const project=state.projectType==="commercial"?(a(L.project,state.projectType)+" — "+a(L.commercial,state.commercialType)):a(L.project,state.projectType);
 const sections=[];
 if(!team){

   pdfRow("كيف عرف عنا",a(L.referral,state.referral)+(state.referral==="other"&&state.referralOther?` — ${state.referralOther}`:""))
  ]));
 }
 sections.push(pdfSection("نطاق المشروع",[

 ]));

  ]));
  sections.push(pdfSection("البرنامج المعماري",[

   ...(has(state.bedroomSpaces,"sons")?[pdfRow("عدد غرف الأبناء",String(state.sonsRooms))]:[]),
   ...(has(state.bedroomSpaces,"daughters")?[pdfRow("عدد غرف البنات",String(state.daughtersRooms))]:[]),

   pdfRow("الخدمات الإضافية",list(L.serviceSpaces,state.serviceSpaces)+(state.serviceOther?` — ${state.serviceOther}`:"")),

 sections.push(`<section class="pdf-section"><h3>الخطوة التالية</h3><div class="pdf-note">مراجعة معلومات الأرض والموقع والمرفقات، ثم استكمال التوجه التصميمي والمتطلبات الناقصة قبل بدء مرحلة التصميم.</div></section>`);

async function ensureHtml2Pdf(){
 if(window.html2pdf) return;
 const urls=[
  "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js",
  "https://unpkg.com/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"
 ];
 let lastError;
 for(const url of urls){
  try{
   await new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src=url; script.async=true;
    script.onload=()=>resolve();
    script.onerror=()=>reject(new Error("PDF library failed to load"));
    document.head.appendChild(script);
   });
   if(window.html2pdf) return;
  }catch(e){ lastError=e; }
 }
 throw lastError||new Error("تعذر تحميل أداة إنشاء PDF");
}

async function htmlToPdfBlob(html,name){
 await ensureHtml2Pdf();
 const stage=document.getElementById("pdfStage");stage.innerHTML=html;
 const el=stage.firstElementChild;
 const options={margin:0,filename:name,image:{type:"jpeg",quality:.95},html2canvas:{scale:1.55,useCORS:true,backgroundColor:"#ffffff",logging:false},jsPDF:{unit:"pt",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:[".pdf-section"]}};
 const worker=html2pdf().set(options).from(el).toPdf();
 const pdf=await worker.outputPdf("blob");
 stage.innerHTML="";
 return pdf;
}
async function uploadBrief(blob,path){
 const res=await fetch(`${SUPABASE_URL}/storage/v1/object/project-briefs/${encodePath(path)}`,{
  method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/pdf","x-upsert":"true"},body:blob
 });
 if(!res.ok)throw new Error("تعذر حفظ ملف الـPDF");
}
async function notify(requestId,submissionId){
 const url=`${SUPABASE_URL}/functions/v1/send-project-notification`;
 let last;
 for(let i=0;i<2;i++){
  try{
   const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY},body:JSON.stringify({request_id:requestId,submission_id:submissionId})});
   if(r.ok)return await r.json(); last=await r.text();
  }catch(e){last=e}
  await new Promise(r=>setTimeout(r,900));
 }
 throw new Error("تم حفظ الطلب، لكن تعذر إرسال إشعار البريد تلقائيًا.");
}

async function submitRequest(){
 if(!validatePage("contact"))return;
 const btn=document.getElementById("submitBtn"); if(btn){btn.disabled=true;btn.textContent="جارٍ إرسال الطلب…"}
 try{
  const submissionId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2)+"-"+Math.random().toString(36).slice(2));
  const uploaded=await uploadFiles(submissionId);
  const payload={
   client_name:state.fullName.trim(),phone:state.phone.trim(),email:state.email.trim()||null,
   project_type:state.projectType,services:state.services,location_link:state.locationLink.trim()||null,status:"new",
   answers:allAnswers(uploaded,submissionId)
  };
  const res=await fetch(`${SUPABASE_URL}/rest/v1/client_requests`,{
   method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(payload)
  });
  if(!res.ok)throw new Error("تعذر حفظ الطلب. حاول مرة أخرى.");
  const rows=await res.json(); const request=(rows&&rows[0]); if(!request?.id)throw new Error("تم الحفظ لكن تعذر إنشاء رقم الطلب.");
  const projectNumber=`OA-${new Date().getFullYear()}-${String(request.id).padStart(3,"0")}`;
  const internalPath=`${submissionId}/${projectNumber}_Client_Project_Brief.pdf`;
  const teamPath=`${submissionId}/${projectNumber}_Design_Brief.pdf`;
  const internalBlob=await htmlToPdfBlob(buildBrief(projectNumber,false,uploaded),`${projectNumber}_Client_Project_Brief.pdf`);
  const teamBlob=await htmlToPdfBlob(buildBrief(projectNumber,true,uploaded),`${projectNumber}_Design_Brief.pdf`);
  await uploadBrief(internalBlob,internalPath);
  await uploadBrief(teamBlob,teamPath);
  try{await notify(request.id,submissionId)}catch(e){console.error(e)}
  current=pages.findIndex(p=>p.id==="thanks");reviewReturn=false;render();window.scrollTo(0,0);
 }catch(e){
  console.error(e);showNotice(e.message||"حدث خطأ أثناء الإرسال.","error");
  if(btn){btn.disabled=false;btn.textContent="إرسال الطلب"}
 }
}
render();
</script>
